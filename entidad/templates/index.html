<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Index</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>
    <body class="bg-light d-flex align-items-center min-vh-100">
        
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card shadow-sm border-0 rounded-3">
                        <div class="card-body p-5">
                            <h2 class="text-center mb-4 fw-bold text-dark">Iniciar Sesión</h2>
                            <form action="/menu" method="POST">
                                {% csrf_token %}
                                <div class="mb-4">
                                    <input type="text" name="txtusu" class="form-control form-control-lg bg-light" placeholder="Usuario" required/>
                                </div>
                                <div class="mb-4">
                                    <input type="password" name="txtcon" class="form-control form-control-lg bg-light" placeholder="Contraseña" required/>
                                </div>
                                <div class="d-grid">
                                    <button class="btn btn-dark btn-lg">Acceder al Sistema</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div id="mensajes" class="text-center mt-3">
                        {% if r2 %}
                            <div class="alert alert-danger" role="alert">
                                {{ r2 }}
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
