<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Registrar Servicio Contratado</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <script>
            const botonCerrarSesion = () => {
                if(window.confirm("¿Está Seguro De Querer Cerrar La Sesión?")){
                    window.location.href = "/logout";
                }
            }
        </script>
    </head>

    <body class="bg-light">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
            <div class="container-fluid px-4">

                <a class="navbar-brand d-flex align-items-center" href="/menu_admin">
                    <h2 class="mb-0 fs-4 fw-bold">
                        USUARIO : {{ nomUsuario }}
                    </h2>
                </a>

                <div class="navbar-nav ms-auto align-items-center">

                    <a class="nav-link fs-5 px-3 active"
                       href="/form_reg_servicio_contratado">
                        Formulario
                    </a>

                    <a class="nav-link fs-5 px-3"
                       href="/listado_servicio_contratado">
                        Listado
                    </a>

                    <a class="nav-link fs-5 px-3"
                       href="/historial">
                        Historial
                    </a>

                    <a class="nav-link fs-5 px-3 text-danger fw-semibold"
                       href="#"
                       onClick="botonCerrarSesion()">
                        Cerrar Sesión
                    </a>

                </div>

            </div>
        </nav>

        <div class="container mt-5">

            <div class="card shadow-sm">

                <div class="card-body p-5">

                    <h2 class="text-center mb-4">
                        Registrar Servicio Contratado
                    </h2>

                    <form action="" method="POST">

                        {% csrf_token %}

                        <div class="mb-4">
                            <input type="text"
                                   name="txtnom"
                                   class="form-control form-control-lg bg-light"
                                   placeholder="Nombre Servicio"
                                   required/>
                        </div>

                        <div class="d-grid mt-5">
                            <button class="btn btn-primary btn-lg py-3">
                                Registrar Servicio
                            </button>
                        </div>

                        {% if r %}
                            <div class="alert alert-success text-center mt-4">
                                {{ r }}
                            </div>
                        {% endif %}

                        {% if r2 %}
                            <div class="alert alert-danger text-center mt-4">
                                {{ r2 }}
                            </div>
                        {% endif %}

                    </form>

                </div>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
